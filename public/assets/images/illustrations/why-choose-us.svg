<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="600" height="500" fill="url(#bg1)" />

  <!-- Large ambient orbs -->
  <circle cx="480" cy="100" r="180" fill="url(#glow1)" opacity="0.6" filter="blur(40px)" />
  <circle cx="120" cy="380" r="160" fill="url(#glow2)" opacity="0.5" filter="blur(40px)" />
  <circle cx="300" cy="460" r="140" fill="url(#glow3)" opacity="0.4" filter="blur(40px)" />

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="600" y2="100" stroke="white" stroke-width="1" />
    <line x1="0" y1="200" x2="600" y2="200" stroke="white" stroke-width="1" />
    <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-width="1" />
    <line x1="0" y1="400" x2="600" y2="400" stroke="white" stroke-width="1" />
    <line x1="100" y1="0" x2="100" y2="500" stroke="white" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="500" stroke="white" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="500" stroke="white" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="500" stroke="white" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="500" stroke="white" stroke-width="1" />
  </g>

  <!-- Connected nodes -->
  <g opacity="0.15">
    <line x1="300" y1="250" x2="160" y2="160" stroke="white" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="300" y1="250" x2="440" y2="140" stroke="white" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="300" y1="250" x2="460" y2="340" stroke="white" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="300" y1="250" x2="140" y2="350" stroke="white" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="160" y1="160" x2="440" y2="140" stroke="white" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="140" y1="350" x2="460" y2="340" stroke="white" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Central element: stylized building/shield -->
  <g transform="translate(264, 210)">
    <rect x="0" y="8" width="72" height="56" rx="4" fill="white" fill-opacity="0.08" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="8" y="16" width="24" height="20" rx="2" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1" stroke-opacity="0.2" />
    <rect x="40" y="16" width="24" height="20" rx="2" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1" stroke-opacity="0.2" />
    <rect x="8" y="42" width="24" height="22" rx="2" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1" stroke-opacity="0.2" />
    <rect x="40" y="42" width="24" height="22" rx="2" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1" stroke-opacity="0.2" />
    <!-- Peak/roof -->
    <path d="M28 8l8-10 8 10" stroke="white" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  </g>

  <!-- Node 1: Shield (top-left) -->
  <g transform="translate(130, 130)">
    <circle cx="30" cy="30" r="30" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />
    <path d="M30 10l-12 10v9c0 10 5 18 12 22 7-4 12-12 12-22v-9l-12-10z" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.7" />
    <path d="M26 28l3 4 7-7" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7" />
  </g>

  <!-- Node 2: Globe (top-right) -->
  <g transform="translate(410, 110)">
    <circle cx="30" cy="30" r="30" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="30" cy="30" r="16" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.7" />
    <ellipse cx="30" cy="30" rx="8" ry="16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="14" y1="30" x2="46" y2="30" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Node 3: Chart/growth (bottom-right) -->
  <g transform="translate(430, 310)">
    <circle cx="30" cy="30" r="30" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="16" y="22" width="8" height="16" rx="2" fill="#fbbf24" fill-opacity="0.5" />
    <rect x="28" y="12" width="8" height="26" rx="2" fill="#fbbf24" fill-opacity="0.7" />
    <rect x="40" y="18" width="8" height="20" rx="2" fill="#fbbf24" fill-opacity="0.5" />
  </g>

  <!-- Node 4: Gear/settings (bottom-left) -->
  <g transform="translate(110, 320)">
    <circle cx="30" cy="30" r="30" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="30" cy="30" r="12" fill="none" stroke="#f472b6" stroke-width="2" stroke-opacity="0.7" />
    <circle cx="30" cy="30" r="4" fill="#f472b6" fill-opacity="0.5" />
    <g opacity="0.4">
      <rect x="27" y="12" width="6" height="8" rx="2" fill="#f472b6" />
      <rect x="27" y="40" width="6" height="8" rx="2" fill="#f472b6" />
      <rect x="12" y="27" width="8" height="6" rx="2" fill="#f472b6" />
      <rect x="40" y="27" width="8" height="6" rx="2" fill="#f472b6" />
    </g>
  </g>

  <!-- Small accent dots -->
  <circle cx="160" cy="160" r="4" fill="#60a5fa" opacity="0.6" />
  <circle cx="440" cy="140" r="4" fill="#34d399" opacity="0.6" />
  <circle cx="460" cy="340" r="4" fill="#fbbf24" opacity="0.6" />
  <circle cx="140" cy="350" r="4" fill="#f472b6" opacity="0.6" />
  <circle cx="300" cy="250" r="5" fill="white" opacity="0.5" />
</svg>