# Nginx reverse proxy for the Simal web app (Next.js / Payload CMS).
# Proxies all traffic on :80 to the app running on the host (:3000).
#
# Usage (started via docker compose / `make up`):
#   http://localhost  →  host app on :3000
#
# To serve a real domain + HTTPS in production, add a second server block
# with `listen 443 ssl`, your cert paths, and `server_name simalme.com;`.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Payload media uploads can be large — allow up to 100 MB
  # (otherwise nginx returns 413 Request Entity Too Large).
  client_max_body_size 100M;

  # ── Image / static-asset cache ─────────────────────────────────────────
  # The project serves images from three places, all behind this proxy:
  #   • /assets/images/...   static images in public/assets
  #   • /_next/image?...     Next.js image-optimizer output
  #   • /api/media/file/...  Payload CMS media streamed from MinIO (S3)
  # Cache their responses on disk so repeat hits are served by nginx and
  # never reach the app (the S3 round-trip for /api/media/file is costly).
  # To invalidate after replacing an image: clear /var/cache/nginx/images
  # (or `docker compose restart nginx`).
  proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=img_cache:10m
    max_size=500m
    inactive=7d
    use_temp_path=off;

  # Gzip text/asset responses
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

  # The Next.js / Payload app runs on the host (pnpm dev / pnpm start).
  # host.docker.internal resolves to the host via the compose extra_hosts setting.
  upstream simal_app {
    server host.docker.internal:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Next.js HMR / live-preview uses a WebSocket — upgrade it.
    location /_next/webpack-hmr {
      proxy_pass http://simal_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # ── Image routes ────────────────────────────────────────────────────
    # Specific image paths are matched before the catch-all `location /`
    # below, so they pick up proxy caching + browser cache headers.

    # Static project images (public/assets/images/*). These
    # filenames are not content-hashed, so after replacing a file clear the
    # img_cache (see comment above) to avoid serving a stale copy.
    location /assets/images/ {
      proxy_pass http://simal_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache img_cache;
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimizer — cache the generated bytes so the app isn't
    # re-run for every request.
    location /_next/image {
      proxy_pass http://simal_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache img_cache;
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Payload CMS media (uploads streamed from MinIO/S3 via Payload's
    # /api/media/file/<filename> route). Cache so we don't re-stream S3.
    location /api/media/file/ {
      proxy_pass http://simal_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache img_cache;
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      proxy_pass http://simal_app;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering on;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }

  # Map the Connection header so WebSocket upgrades pass through cleanly.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
